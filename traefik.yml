# Traefik static configuration
api:
    dashboard: true
    insecure: true

entryPoints:
    web:
        address: ":80"
        http:
            redirections:
                entryPoint:
                    to: websecure
                    scheme: https
                    permanent: true

    websecure:
        address: ":443"

providers:
    docker:
        endpoint: "unix:///var/run/docker.sock"
        exposedByDefault: false

certificatesResolvers:
    letsencrypt:
        acme:
            email: anunay.biswas@gmail.com
            storage: /letsencrypt/acme.json
            httpChallenge:
                entryPoint: web
