name: "tac-labs-frontend"

services:
  traefik:
    image: traefik:v3.6.6
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - ./traefik.yml:/traefik.yml:ro
    networks:
      - app-network
    restart: unless-stopped

  tac-labs-next-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GOOGLE_ANALYTICS=${NEXT_PUBLIC_GOOGLE_ANALYTICS}
        - NEXT_PUBLIC_CLARITY_PROJECT_ID=${NEXT_PUBLIC_CLARITY_PROJECT_ID}
        - NEXT_PUBLIC_STRAPI_URL=${NEXT_PUBLIC_STRAPI_URL}
    image: tac-labs/next-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      # Main frontend router (HTTPS)
      - "traefik.http.routers.frontend.rule=Host(`tacdesignlab.com`) || Host(`www.tacdesignlab.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      # Redirect .org to .com (HTTPS)
      - "traefik.http.routers.frontend-org-redirect.rule=Host(`tacdesignlab.org`) || Host(`www.tacdesignlab.org`)"
      - "traefik.http.routers.frontend-org-redirect.entrypoints=websecure"
      - "traefik.http.routers.frontend-org-redirect.tls=true"
      - "traefik.http.routers.frontend-org-redirect.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-org-redirect.middlewares=org-to-com"
      - "traefik.http.middlewares.org-to-com.redirectregex.regex=^https?://(?:www\\.)?tacdesignlab\\.org/(.*)"
      - "traefik.http.middlewares.org-to-com.redirectregex.replacement=https://tacdesignlab.com/$${1}"
      - "traefik.http.middlewares.org-to-com.redirectregex.permanent=true"
    restart: unless-stopped

  strapi:
    image: naskio/strapi:latest
    environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=strapi
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_SSL=false
      - JWT_SECRET=${JWT_SECRET:-changeThisToASecretKey}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-changeThisToASecretKey}
      - APP_KEYS=${APP_KEYS:-toBeModified1,toBeModified2}
      - API_TOKEN_SALT=${API_TOKEN_SALT:-toBeModified}
      - URL=https://strapi.tacdesignlab.com
      - ADMIN_URL=https://strapi.tacdesignlab.com/admin
    ports:
      - "1337:1337"
    volumes:
      - strapi-data:/srv/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.strapi.rule=Host(`strapi.tacdesignlab.com`)"
      - "traefik.http.routers.strapi.entrypoints=websecure"
      - "traefik.http.routers.strapi.tls=true"
      - "traefik.http.routers.strapi.tls.certresolver=letsencrypt"
      - "traefik.http.services.strapi.loadbalancer.server.port=1337"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=strapi
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  strapi-data:
    driver: local

networks:
  app-network:
    driver: bridge
