name: "tac-labs-frontend"

services:
  traefik:
    image: traefik:v3.6.6
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - ./traefik.yml:/traefik.yml:ro
    networks:
      - app-network
    restart: unless-stopped

  tac-labs-next-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GOOGLE_ANALYTICS=${NEXT_PUBLIC_GOOGLE_ANALYTICS}
        - NEXT_PUBLIC_CLARITY_PROJECT_ID=${NEXT_PUBLIC_CLARITY_PROJECT_ID}
        - NEXT_PUBLIC_STRAPI_URL=${NEXT_PUBLIC_STRAPI_URL}
    image: tac-labs/next-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      # Main frontend router (HTTPS)
      - "traefik.http.routers.frontend.rule=Host(`tacdesignlab.com`) || Host(`www.tacdesignlab.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      # Redirect .org to .com (HTTPS)
      - "traefik.http.routers.frontend-org-redirect.rule=Host(`tacdesignlab.org`) || Host(`www.tacdesignlab.org`)"
      - "traefik.http.routers.frontend-org-redirect.entrypoints=websecure"
      - "traefik.http.routers.frontend-org-redirect.tls=true"
      - "traefik.http.routers.frontend-org-redirect.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-org-redirect.middlewares=org-to-com"
      - "traefik.http.middlewares.org-to-com.redirectregex.regex=^https?://(?:www\\.)?tacdesignlab\\.org/(.*)"
      - "traefik.http.middlewares.org-to-com.redirectregex.replacement=https://tacdesignlab.com/$${1}"
      - "traefik.http.middlewares.org-to-com.redirectregex.permanent=true"
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
